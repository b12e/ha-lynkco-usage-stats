name: Collect usage stats

on:
  schedule:
    # Daily at 06:00 UTC. The HA analytics dump updates roughly daily.
    - cron: "0 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "integrations.json"
      - "scripts/collect_usage.py"
      - ".github/workflows/collect-usage.yml"

permissions:
  contents: write

concurrency:
  group: collect-usage
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Collect usage statistics
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OUTPUT_DIR: usage
          OUTPUT_FILE: usage.json
        run: python scripts/collect_usage.py

      - name: Write job summary
        run: |
          {
            echo '## HACS usage stats'
            echo
            echo '```json'
            cat usage.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: usage
          path: |
            usage.json
            usage/

      - name: Commit updated usage stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add usage.json usage/
          if git diff --cached --quiet; then
            echo "No changes to usage stats"
            exit 0
          fi
          git commit -m "chore: update usage stats [skip ci]"
          git push
